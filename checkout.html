<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | Mono Safety</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Inter", sans-serif;
    background: #F4F7FA;
    color: #1F2937;
    line-height: 1.6;
}

.container {
    width: min(1100px, 90%);
    margin: auto;
}


/* =========================
   NAVBAR
========================= */

nav {
    background: white;
    height: 90px;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 15px rgba(0,0,0,.06);
}

nav .container {
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo img {
    height: 80px;
    width: auto;
    display: block;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 35px;
    list-style: none;
}

.nav-links a {
    text-decoration: none;
    color: #1F2937;
    font-weight: 600;
    transition: .3s;
}

.nav-links a:hover {
    color: #0057B8;
}


/* =========================
   CHECKOUT
========================= */

.checkout-container {
    padding: 60px 0 100px;
}

h1 {
    font-family: "Poppins", sans-serif;
    color: #0057B8;
    margin-bottom: 40px;
    font-size: 42px;
}

.checkout-layout {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 40px;
    align-items: start;
}


/* =========================
   PRODUCTS
========================= */

.checkout-box {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,.08);
}

.item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 20px 0;
    border-bottom: 1px solid #ddd;
}

.left {
    display: flex;
    align-items: center;
    gap: 20px;
}

.left img {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 10px;
}

.name {
    font-family: "Poppins", sans-serif;
    font-size: 18px;
    font-weight: 600;
}

.details {
    color: #666;
    margin-top: 5px;
    font-size: 14px;
}

.right {
    text-align: right;
    white-space: nowrap;
}


/* =========================
   TOTALS
========================= */

.totals {
    margin-top: 25px;
}

.total-line {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    font-size: 17px;
}

.total-line.tax {
    padding-bottom: 20px;
}

.total-final {
    border-top: 2px solid #ddd;
    padding-top: 20px;
    display: flex;
    justify-content: space-between;
    font-size: 25px;
    font-weight: bold;
    color: #0057B8;
}

.delivery-note {
    text-align: right;
    margin-top: 10px;
    color: #777;
    font-size: 14px;
}


/* =========================
   INVOICE FORM
========================= */

.invoice-box {
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,.08);
}

.invoice-box h2 {
    font-family: "Poppins", sans-serif;
    color: #0057B8;
    margin-bottom: 10px;
}

.invoice-box > p {
    color: #666;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 7px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-family: "Inter", sans-serif;
    font-size: 15px;
}

.form-group textarea {
    min-height: 100px;
    resize: vertical;
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #0057B8;
}


/* =========================
   BUTTON
========================= */

button {
    margin-top: 10px;
    width: 100%;
    padding: 17px;
    border: none;
    background: #0057B8;
    color: white;
    font-size: 17px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
}

button:hover {
    background: #003F87;
}


/* =========================
   EMPTY CART
========================= */

.empty {
    text-align: center;
    padding: 50px 20px;
}

.empty h2 {
    margin-bottom: 15px;
}

.empty a {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 25px;
    background: #0057B8;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:900px) {

    nav {
        height: auto;
        padding: 10px 0;
    }

    nav .container {
        height: auto;
        flex-direction: column;
        gap: 10px;
    }

    .logo img {
        height: 65px;
    }

    .nav-links {
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .nav-links a {
        font-size: 14px;
    }

    .checkout-layout {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 34px;
    }
}

@media(max-width:600px) {

    .checkout-container {
        padding: 40px 0 70px;
    }

    .checkout-box,
    .invoice-box {
        padding: 22px;
    }

    .item {
        align-items: flex-start;
    }

    .left img {
        width: 70px;
        height: 70px;
    }

    .name {
        font-size: 15px;
    }

    .details {
        font-size: 13px;
    }

    .right {
        font-size: 14px;
    }
}

</style>

</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<nav>

<div class="container">


<div class="logo">

    <img src="images/logo.png" alt="Mono Safety Logo">

</div>


<ul class="nav-links">

    <li>
        <a href="index.html">Home</a>
    </li>

    <li>
        <a href="products.html">Products</a>
    </li>

    <li>
        <a href="about.html">About</a>
    </li>

    <li>
        <a href="contact.html">Contact</a>
    </li>

    <li>
        <a href="cart.html">
            🛒 Cart (<span id="cart-count">0</span>)
        </a>
    </li>

</ul>


</div>

</nav>

<!-- =========================
     CHECKOUT
========================= -->

<div class="container checkout-container">

<h1>Request an Invoice</h1>

<div class="checkout-layout">

<!-- =========================
     ORDER
========================= -->

<div class="checkout-box">

<div id="checkout-items"></div>


<div class="totals">

    <div class="total-line">

        <span>Subtotal</span>

        <span>
            €<span id="subtotal">0.00</span>
        </span>

    </div>


    <div class="total-line tax">

        <span>VAT @ 23%</span>

        <span>
            €<span id="vat">0.00</span>
        </span>

    </div>


    <div class="total-final">

        <span>Total</span>

        <span>
            €<span id="grand-total">0.00</span>
        </span>

    </div>


    <p class="delivery-note">
        Delivery fee may apply
    </p>

</div>


</div>

<!-- =========================
     CUSTOMER DETAILS
========================= -->

<div class="invoice-box">


<h2>Invoice Details</h2>

<p>
    Enter your details below and we will contact you regarding your order and invoice.
</p>


<form id="invoice-form">


    <div class="form-group">

        <label for="name">
            Name / Company Name
        </label>

        <input
            type="text"
            id="name"
            required
            placeholder="Your name or company name">

    </div>


    <div class="form-group">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            required
            placeholder="your@email.com">

    </div>


    <div class="form-group">

        <label for="phone">
            Phone
        </label>

        <input
            type="tel"
            id="phone"
            required
            placeholder="Your phone number">

    </div>


    <div class="form-group">

        <label for="address">
            Delivery Address
        </label>

        <textarea
            id="address"
            required
            placeholder="Enter your delivery address"></textarea>

    </div>


    <div class="form-group">

        <label for="notes">
            Order Notes
        </label>

        <textarea
            id="notes"
            placeholder="Any additional information?"></textarea>

    </div>


    <button type="submit">
        Request Invoice
    </button>


</form>


</div>

</div>

</div>

<script>

/* =========================
   LOAD CART
========================= */

let cart = JSON.parse(localStorage.getItem("cart")) || [];

const items = document.getElementById("checkout-items");

let subtotal = 0;


/* =========================
   UPDATE CART COUNT
========================= */

function updateCartCount() {

    const counter = document.getElementById("cart-count");

    if (counter) {

        let totalItems = 0;

        cart.forEach(item => {
            totalItems += item.qty;
        });

        counter.textContent = totalItems;

    }

}

updateCartCount();


/* =========================
   DISPLAY CART
========================= */

if (cart.length === 0) {

    items.innerHTML = `
        <div class="empty">

            <h2>Your cart is empty.</h2>

            <p>Add some products before requesting an invoice.</p>

            <a href="products.html">
                View Products
            </a>

        </div>
    `;

    document.querySelector(".invoice-box").style.display = "none";
    document.querySelector(".totals").style.display = "none";


} else {


    cart.forEach(item => {

        let lineTotal = item.price * item.qty;

        subtotal += lineTotal;


        items.innerHTML += `

            <div class="item">

                <div class="left">

                    <img
                        src="${item.image}"
                        alt="${item.name}">

                    <div>

                        <div class="name">
                            ${item.name}
                        </div>

                        <div class="details">

                            Quantity: ${item.qty}<br>

                            €${item.price.toFixed(2)} each

                        </div>

                    </div>

                </div>


                <div class="right">

                    <strong>
                        €${lineTotal.toFixed(2)}
                    </strong>

                </div>

            </div>

        `;

    });


    /* =========================
       CALCULATE VAT
    ========================= */

    const vat = subtotal * 0.23;

    const grandTotal = subtotal + vat;


    document.getElementById("subtotal").textContent =
        subtotal.toFixed(2);

    document.getElementById("vat").textContent =
        vat.toFixed(2);

    document.getElementById("grand-total").textContent =
        grandTotal.toFixed(2);

}


/* =========================
   REQUEST INVOICE
========================= */

document.getElementById("invoice-form").addEventListener("submit", function(event) {

    event.preventDefault();


    if (cart.length === 0) {

        alert("Your cart is empty.");

        return;

    }


    const customerName =
        document.getElementById("name").value;

    const customerEmail =
        document.getElementById("email").value;

    const customerPhone =
        document.getElementById("phone").value;

    const customerAddress =
        document.getElementById("address").value;

    const customerNotes =
        document.getElementById("notes").value;


    const vat = subtotal * 0.23;

    const grandTotal = subtotal + vat;


    /* =========================
       CREATE ORDER SUMMARY
    ========================= */

    let orderDetails = "";


    cart.forEach(item => {

        const lineTotal = item.price * item.qty;

        orderDetails +=
            item.name +
            " | Qty: " +
            item.qty +
            " | €" +
            lineTotal.toFixed(2) +
            "\n";

    });


    const subject =
        "Mono Safety Invoice Request - " +
        customerName;


    const body =

        "NEW INVOICE REQUEST\n\n" +

        "CUSTOMER DETAILS\n\n" +

        "Name / Company: " +
        customerName +
        "\n" +

        "Email: " +
        customerEmail +
        "\n" +

        "Phone: " +
        customerPhone +
        "\n\n" +

        "Delivery Address:\n" +
        customerAddress +
        "\n\n" +

        "ORDER\n\n" +

        orderDetails +

        "\n" +

        "Subtotal: €" +
        subtotal.toFixed(2) +
        "\n" +

        "VAT @ 23%: €" +
        vat.toFixed(2) +
        "\n" +

        "TOTAL: €" +
        grandTotal.toFixed(2) +
        "\n\n" +

        "Delivery fee may apply.\n\n" +

        "Order Notes:\n" +
        customerNotes;


    /* =========================
       OPEN EMAIL
    ========================= */

    const mailto =
        "mailto:monocare50@gmail.com" +
        "?subject=" +
        encodeURIComponent(subject) +
        "&body=" +
        encodeURIComponent(body);


    window.location.href = mailto;

});

</script>

</body>

</html>
