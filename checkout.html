<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | Mono Safety</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Inter, sans-serif;
    background: #F4F7FA;
    color: #1F2937;
}

.container {
    width: min(1200px, 90%);
    margin: auto;
}


/* =========================
   NAVBAR
========================= */

nav {
    background: white;
    padding: 18px 0;
    box-shadow: 0 2px 15px rgba(0,0,0,.08);
}

nav .container {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo img {
    height: 60px;
    width: auto;
}

.nav-links {
    display: flex;
    gap: 30px;
    list-style: none;
    align-items: center;
}

.nav-links a {
    text-decoration: none;
    color: #1F2937;
    font-weight: 600;
}

.nav-links a:hover {
    color: #0057B8;
}


/* =========================
   MAIN
========================= */

.checkout-container {
    padding: 60px 0;
}

h1 {
    font-family: Poppins, sans-serif;
    margin-bottom: 40px;
    color: #0057B8;
}


/* =========================
   TWO COLUMNS
========================= */

.checkout-layout {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 35px;
    align-items: start;
}


/* =========================
   BOXES
========================= */

.checkout-box {
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,.08);
}


/* =========================
   PRODUCTS
========================= */

.products-title {
    font-family: Poppins, sans-serif;
    color: #0057B8;
    margin-bottom: 20px;
}

.checkout-items {
    margin-top: 10px;
}

.item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 20px 0;
    border-bottom: 1px solid #ddd;
}

.left {
    display: flex;
    align-items: center;
    gap: 20px;
    min-width: 0;
}

.left img {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 10px;
    background: #F4F7FA;
    flex-shrink: 0;
}

.name {
    font-family: Poppins, sans-serif;
    font-size: 17px;
    line-height: 1.4;
}

.details {
    color: #666;
    margin-top: 5px;
    font-size: 14px;
}

.right {
    text-align: right;
    white-space: nowrap;
    font-size: 18px;
}


/* =========================
   TOTALS
========================= */

.totals {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 2px solid #ddd;
}

.total-line {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 17px;
}

.total-line.final {
    margin-top: 15px;
    padding-top: 18px;
    border-top: 1px solid #ddd;
    font-size: 24px;
    font-weight: bold;
}

.delivery-note {
    text-align: right;
    color: #777;
    font-size: 14px;
    margin-top: 8px;
}


/* =========================
   CUSTOMER DETAILS
========================= */

.customer-details h2 {
    font-family: Poppins, sans-serif;
    color: #0057B8;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-family: Inter, sans-serif;
    font-size: 15px;
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #0057B8;
    box-shadow: 0 0 0 3px rgba(0,87,184,.10);
}

.form-group textarea {
    min-height: 110px;
    resize: vertical;
}


/* =========================
   BUTTON
========================= */

button {
    margin-top: 30px;
    width: 100%;
    padding: 18px;
    border: none;
    background: #0057B8;
    color: white;
    font-size: 18px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    transition: .2s;
}

button:hover {
    background: #003F87;
}

button:disabled {
    opacity: .7;
    cursor: not-allowed;
}


/* =========================
   STATUS MESSAGE
========================= */

#form-status {
    display: none;
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    font-weight: 600;
    text-align: center;
}

#form-status.success {
    display: block;
    background: #E8F5E9;
    color: #2E7D32;
}

#form-status.error {
    display: block;
    background: #FFEBEE;
    color: #C62828;
}


/* =========================
   EMPTY CART
========================= */

.empty {
    text-align: center;
    padding: 50px 20px;
}

.empty a {
    display: inline-block;
    margin-top: 20px;
    color: #0057B8;
    font-weight: 600;
    text-decoration: none;
}


/* =========================
   MOBILE
========================= */

@media(max-width:900px) {

    nav .container {
        flex-direction: column;
        gap: 15px;
    }

    .nav-links {
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .checkout-layout {
        grid-template-columns: 1fr;
    }

    .checkout-box {
        padding: 25px;
    }

    .item {
        gap: 12px;
    }

    .left img {
        width: 70px;
        height: 70px;
    }

    .name {
        font-size: 15px;
    }

    .right {
        font-size: 16px;
    }

}

</style>

</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<nav>

<div class="container">

```
<div class="logo">

    <img
        src="images/logo.png"
        alt="Mono Safety Logo"
    >

</div>


<ul class="nav-links">

    <li>
        <a href="home.html">Home</a>
    </li>

    <li>
        <a href="products.html">Products</a>
    </li>

    <li>
        <a href="about.html">About</a>
    </li>

    <li>
        <a href="contact.html">Contact</a>
    </li>

    <li>
        <a href="cart.html">
            🛒 Cart (<span id="cart-count">0</span>)
        </a>
    </li>

</ul>
```

</div>

</nav>

<!-- =========================
     CHECKOUT
========================= -->

<div class="container checkout-container">

<h1>Request an Invoice</h1>

<div class="checkout-layout">

<!-- =========================
     LEFT SIDE
========================= -->

<div class="checkout-box">

```
<h2 class="products-title">
    Your Order
</h2>


<div
    id="checkout-items"
    class="checkout-items"
></div>


<div class="totals">

    <div class="total-line">

        <span>
            Subtotal
        </span>

        <span>
            €<span id="subtotal">0.00</span>
        </span>

    </div>


    <div class="total-line">

        <span>
            VAT @ 23%
        </span>

        <span>
            €<span id="vat">0.00</span>
        </span>

    </div>


    <div class="total-line final">

        <span>
            Total
        </span>

        <span>
            €<span id="grand-total">0.00</span>
        </span>

    </div>


    <div class="delivery-note">
        Delivery fee may apply
    </div>

</div>
```

</div>

<!-- =========================
     RIGHT SIDE
========================= -->

<div class="checkout-box">

<form id="invoice-form">

<form action="https://formsubmit.co/monocare50@gmail.com" method="POST">

    <input type="hidden" name="_subject" value="Mono Safety TEST">

    <input
        type="text"
        name="name"
        placeholder="Name"
        required
    >

    <input
        type="email"
        name="email"
        placeholder="Email"
        required
    >

    <button type="submit">
        SEND TEST
    </button>

</form>

<div id="form-status"></div>
```

</form>

</div>

</div>

</div>

<script>

/* =========================
   LOAD CART
========================= */

let cart =
    JSON.parse(localStorage.getItem("cart")) || [];


const items =
    document.getElementById("checkout-items");

const subtotalElement =
    document.getElementById("subtotal");

const vatElement =
    document.getElementById("vat");

const totalElement =
    document.getElementById("grand-total");

const invoiceForm =
    document.getElementById("invoice-form");

const invoiceButton =
    document.getElementById("invoice-button");

const statusMessage =
    document.getElementById("form-status");


let subtotal = 0;


/* =========================
   CART COUNT
========================= */

function updateCartCount() {

    const counter =
        document.getElementById("cart-count");

    if (!counter) return;

    let totalItems = 0;

    cart.forEach(item => {

        totalItems += Number(item.qty) || 0;

    });

    counter.textContent = totalItems;

}


/* =========================
   EMPTY CART
========================= */

if (cart.length === 0) {

    items.innerHTML = `

        <div class="empty">

            <h2>
                Your cart is empty.
            </h2>

            <a href="products.html">
                Continue Shopping
            </a>

        </div>

    `;

    invoiceButton.style.display = "none";

}


/* =========================
   DISPLAY CART
========================= */

else {

    let orderDetails = "";


    cart.forEach(item => {

        const price =
            Number(item.price) || 0;

        const quantity =
            Number(item.qty) || 1;

        const lineTotal =
            price * quantity;


        subtotal += lineTotal;


        orderDetails +=
            item.name +
            " | Quantity: " +
            quantity +
            " | €" +
            price.toFixed(2) +
            " each | €" +
            lineTotal.toFixed(2) +
            "\n";


        items.innerHTML += `

            <div class="item">

                <div class="left">

                    <img
                        src="${item.image}"
                        alt="${item.name}"
                    >

                    <div>

                        <div class="name">
                            ${item.name}
                        </div>

                        <div class="details">

                            Quantity:
                            ${quantity}

                            <br>

                            €${price.toFixed(2)} each

                        </div>

                    </div>

                </div>


                <div class="right">

                    <strong>
                        €${lineTotal.toFixed(2)}
                    </strong>

                </div>

            </div>

        `;

    });


    /* =========================
       VAT
    ========================= */

    const vat =
        subtotal * 0.23;

    const grandTotal =
        subtotal + vat;


    /* =========================
       DISPLAY TOTALS
    ========================= */

    subtotalElement.textContent =
        subtotal.toFixed(2);

    vatElement.textContent =
        vat.toFixed(2);

    totalElement.textContent =
        grandTotal.toFixed(2);


    /* =========================
       HIDDEN FORM DATA
    ========================= */

    document.getElementById(
        "order-details"
    ).value = orderDetails;


    document.getElementById(
        "order-subtotal"
    ).value =
        "€" + subtotal.toFixed(2);


    document.getElementById(
        "order-vat"
    ).value =
        "€" + vat.toFixed(2);


    document.getElementById(
        "order-total"
    ).value =
        "€" + grandTotal.toFixed(2);

}


/* =========================
   FORM SUBMISSION
========================= */

invoiceForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /* Clear previous status */

        statusMessage.className = "";
        statusMessage.textContent = "";


        /* Disable button */

        invoiceButton.disabled = true;

        invoiceButton.textContent =
            "Sending Invoice Request...";


        /*
           Convert the form into an object
           that FormSubmit can receive.
        */

        const formData =
            new FormData(invoiceForm);


        const data = {};


        formData.forEach(
            (value, key) => {

                data[key] = value;

            }
        );


        try {

            /*
               FormSubmit AJAX endpoint
            */

            const response =
                await fetch(
                    "https://formsubmit.co/ajax/monocare50@gmail.com",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        body:
                            JSON.stringify(data)
                    }
                );


            const result =
                await response.json();


            console.log(
                "FormSubmit response:",
                result
            );


            /*
               SUCCESS
            */

            if (
                response.ok &&
                result.success !== false
            ) {

                statusMessage.className =
                    "success";

                statusMessage.textContent =
                    "✓ Invoice request sent successfully!";


                /*
                   Clear cart only after
                   FormSubmit accepts it.
                */

                localStorage.removeItem("cart");


                /*
                   Update cart number
                */

                updateCartCount();


                /*
                   Keep the success message
                   visible for the customer.
                */

                invoiceButton.textContent =
                    "Request Sent";

            }


            /*
               FORM SUBMIT ERROR
            */

            else {

                throw new Error(
                    result.message ||
                    "FormSubmit rejected the request."
                );

            }

        }

        catch (error) {

            console.error(
                "Invoice submission error:",
                error
            );


            statusMessage.className =
                "error";

            statusMessage.textContent =
                "✕ We couldn't send your invoice request. Please try again.";


            invoiceButton.disabled =
                false;

            invoiceButton.textContent =
                "Request an Invoice";

        }

    }
);


/* =========================
   START
========================= */

updateCartCount();

</script>

</body>

</html>
