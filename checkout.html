<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | Mono Safety</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Inter, sans-serif;
    background: #F4F7FA;
    color: #1F2937;
}

.container {
    width: min(1200px, 90%);
    margin: auto;
}


/* =========================
   NAVBAR
========================= */

nav {
    background: white;
    padding: 18px 0;
    box-shadow: 0 2px 15px rgba(0,0,0,.08);
}

nav .container {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo img {
    height: 60px;
    width: auto;
}

.nav-links {
    display: flex;
    gap: 30px;
    list-style: none;
    align-items: center;
}

.nav-links a {
    text-decoration: none;
    color: #1F2937;
    font-weight: 600;
}

.nav-links a:hover {
    color: #0057B8;
}


/* =========================
   CHECKOUT
========================= */

.checkout-container {
    padding: 60px 0;
}

h1 {
    font-family: Poppins, sans-serif;
    margin-bottom: 40px;
    color: #0057B8;
}

.checkout-layout {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 35px;
    align-items: start;
}

.checkout-box {
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,.08);
}


/* =========================
   ORDER
========================= */

.products-title {
    font-family: Poppins, sans-serif;
    color: #0057B8;
    margin-bottom: 20px;
}

.checkout-items {
    margin-top: 10px;
}

.item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 20px 0;
    border-bottom: 1px solid #ddd;
}

.left {
    display: flex;
    align-items: center;
    gap: 20px;
    min-width: 0;
}

.left img {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 10px;
    background: #F4F7FA;
    flex-shrink: 0;
}

.name {
    font-family: Poppins, sans-serif;
    font-size: 17px;
    line-height: 1.4;
}

.details {
    color: #666;
    margin-top: 5px;
    font-size: 14px;
}

.right {
    text-align: right;
    white-space: nowrap;
    font-size: 18px;
}


/* =========================
   TOTALS
========================= */

.totals {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 2px solid #ddd;
}

.total-line {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 17px;
}

.total-line.final {
    margin-top: 15px;
    padding-top: 18px;
    border-top: 1px solid #ddd;
    font-size: 24px;
    font-weight: bold;
}

.delivery-note {
    text-align: right;
    color: #777;
    font-size: 14px;
    margin-top: 8px;
}


/* =========================
   CUSTOMER DETAILS
========================= */

.customer-details h2 {
    font-family: Poppins, sans-serif;
    color: #0057B8;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-family: Inter, sans-serif;
    font-size: 15px;
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #0057B8;
    box-shadow: 0 0 0 3px rgba(0,87,184,.10);
}

.form-group textarea {
    min-height: 110px;
    resize: vertical;
}


/* =========================
   BUTTON
========================= */

button {
    margin-top: 30px;
    width: 100%;
    padding: 18px;
    border: none;
    background: #0057B8;
    color: white;
    font-size: 18px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    transition: .2s;
}

button:hover {
    background: #003F87;
}

button:active {
    transform: translateY(1px);
}


/* =========================
   EMPTY CART
========================= */

.empty {
    text-align: center;
    padding: 50px 20px;
}

.empty h2 {
    margin-bottom: 10px;
}

.empty a {
    display: inline-block;
    margin-top: 25px;
    padding: 14px 30px;
    background: #0057B8;
    color: #ffffff;
    font-weight: 600;
    text-decoration: none;
    border-radius: 8px;
    border: 2px solid #0057B8;
    transition: all 0.2s ease;
    box-shadow: 0 5px 12px rgba(0,87,184,.2);
}

.empty a:hover {
    background: #003F87;
    border-color: #003F87;
    color: #ffffff;
    transform: translateY(-2px);
}


/* =========================
   MOBILE
========================= */

@media(max-width:900px) {

    nav .container {
        flex-direction: column;
        gap: 15px;
    }

    .nav-links {
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .checkout-layout {
        grid-template-columns: 1fr;
    }

    .checkout-box {
        padding: 25px;
    }

    .item {
        gap: 12px;
    }

    .left img {
        width: 70px;
        height: 70px;
    }

    .name {
        font-size: 15px;
    }

    .right {
        font-size: 16px;
    }

}

</style>

</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<nav>

<div class="container">


<div class="logo">

    <img
        src="images/logo.png"
        alt="Mono Safety Logo"
    >

</div>


<ul class="nav-links">

    <li>
        <a href="home.html">Home</a>
    </li>

    <li>
        <a href="products.html">Products</a>
    </li>

    <li>
        <a href="about.html">About</a>
    </li>

    <li>
        <a href="contact.html">Contact</a>
    </li>

    <li>
        <a href="cart.html">
            🛒 Cart (<span id="cart-count">0</span>)
        </a>
    </li>

</ul>


</div>

</nav>

<!-- =========================
     MAIN
========================= -->

<div class="container checkout-container">

<h1>
    Request an Invoice
</h1>

<div class="checkout-layout">

<!-- =========================
     ORDER
========================= -->

<div class="checkout-box">


<h2 class="products-title">
    Your Order
</h2>


<div
    id="checkout-items"
    class="checkout-items"
></div>


<div class="totals">

    <div class="total-line">

        <span>
            Subtotal
        </span>

        <span>
            €<span id="subtotal">0.00</span>
        </span>

    </div>


    <div class="total-line">

        <span>
            VAT @ 23%
        </span>

        <span>
            €<span id="vat">0.00</span>
        </span>

    </div>


    <div class="total-line final">

        <span>
            Total
        </span>

        <span>
            €<span id="grand-total">0.00</span>
        </span>

    </div>


    <div class="delivery-note">
        Delivery fee may apply
    </div>

</div>


</div>

<!-- =========================
     CUSTOMER FORM
========================= -->

<div class="checkout-box">

<form
    action="https://formspree.io/f/xkjwrrpv"
    method="POST"
>


<!-- CUSTOMER DETAILS -->

<div class="customer-details">

    <h2>
        Customer Details
    </h2>


    <div class="form-group">

        <label for="customer-name">
            Name
        </label>

        <input
            type="text"
            id="customer-name"
            name="Customer Name"
            placeholder="Your name"
            required
        >

    </div>


    <div class="form-group">

        <label for="customer-email">
            Email
        </label>

        <input
            type="email"
            id="customer-email"
            name="email"
            placeholder="Your email address"
            required
        >

    </div>


    <div class="form-group">

        <label for="customer-phone">
            Phone
        </label>

        <input
            type="tel"
            id="customer-phone"
            name="Customer Phone"
            placeholder="Your phone number"
            required
        >

    </div>


    <div class="form-group">

        <label for="company">
            Company
        </label>

        <input
            type="text"
            id="company"
            name="Company"
            placeholder="Company name (optional)"
        >

    </div>


    <div class="form-group">

        <label for="address">
            Delivery / Billing Address
        </label>

        <textarea
            id="address"
            name="Address"
            placeholder="Enter your address"
            required
        ></textarea>

    </div>

</div>


<!-- =========================
     ORDER INFORMATION
========================= -->

<input
    type="hidden"
    id="order-details"
    name="Order Details"
>


<input
    type="hidden"
    id="order-subtotal"
    name="Subtotal"
>


<input
    type="hidden"
    id="order-vat"
    name="VAT 23%"
>


<input
    type="hidden"
    id="order-total"
    name="Total"
>


<!-- =========================
     SUBMIT
========================= -->

<button type="submit">
    Request an Invoice
</button>
```

</form>

</div>

</div>

</div>

<script>

/* =========================
   LOAD CART
========================= */

let cart =
    JSON.parse(localStorage.getItem("cart")) || [];


/* =========================
   ELEMENTS
========================= */

const items =
    document.getElementById("checkout-items");

const subtotalElement =
    document.getElementById("subtotal");

const vatElement =
    document.getElementById("vat");

const totalElement =
    document.getElementById("grand-total");


let subtotal = 0;


/* =========================
   CART COUNT
========================= */

function updateCartCount() {

    const counter =
        document.getElementById("cart-count");

    if (!counter) {
        return;
    }

    let totalItems = 0;

    cart.forEach(item => {

        totalItems +=
            Number(item.qty) || 0;

    });

    counter.textContent =
        totalItems;

}


/* =========================
   EMPTY CART
========================= */

if (cart.length === 0) {

    items.innerHTML = `

        <div class="empty">

            <h2>
                Your cart is empty.
            </h2>

            <a href="products.html">
                Continue Shopping
            </a>

        </div>

    `;

}


/* =========================
   DISPLAY CART
========================= */

else {

    let orderDetails = "";


    cart.forEach(item => {

        const price =
            Number(item.price) || 0;

        const quantity =
            Number(item.qty) || 1;

        const lineTotal =
            price * quantity;


        subtotal +=
            lineTotal;


        /*
           Build the order information
           that will be sent to Formspree.
        */

        orderDetails +=
            item.name +
            " | Quantity: " +
            quantity +
            " | €" +
            price.toFixed(2) +
            " each | €" +
            lineTotal.toFixed(2) +
            "\n";


        /*
           Display product.
        */

        items.innerHTML += `

            <div class="item">

                <div class="left">

                    <img
                        src="${item.image}"
                        alt="${item.name}"
                    >

                    <div>

                        <div class="name">
                            ${item.name}
                        </div>

                        <div class="details">

                            Quantity:
                            ${quantity}

                            <br>

                            €${price.toFixed(2)}
                            each

                        </div>

                    </div>

                </div>


                <div class="right">

                    <strong>
                        €${lineTotal.toFixed(2)}
                    </strong>

                </div>

            </div>

        `;

    });


    /* =========================
       VAT
    ========================= */

    const vat =
        subtotal * 0.23;


    const grandTotal =
        subtotal + vat;


    /* =========================
       DISPLAY TOTALS
    ========================= */

    subtotalElement.textContent =
        subtotal.toFixed(2);

    vatElement.textContent =
        vat.toFixed(2);

    totalElement.textContent =
        grandTotal.toFixed(2);


    /* =========================
       FORM DATA
    ========================= */

    document.getElementById(
        "order-details"
    ).value =
        orderDetails;


    document.getElementById(
        "order-subtotal"
    ).value =
        "€" + subtotal.toFixed(2);


    document.getElementById(
        "order-vat"
    ).value =
        "€" + vat.toFixed(2);


    document.getElementById(
        "order-total"
    ).value =
        "€" + grandTotal.toFixed(2);

}


/* =========================
   START
========================= */

updateCartCount();

</script>

</body>

</html>
