<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cart | Mono Safety</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

font-family:Inter,sans-serif;
background:#F4F7FA;
color:#1F2937;

}


.container{

width:min(1200px,90%);
margin:auto;

}



/* NAV */

nav{

background:white;
padding:20px 0;
box-shadow:0 2px 15px rgba(0,0,0,.05);

}


nav .container{

display:flex;
justify-content:space-between;
align-items:center;

}


.logo img{

height:60px;

}


.nav-links{

display:flex;
gap:30px;
list-style:none;

}


.nav-links a{

text-decoration:none;
color:#1F2937;
font-weight:600;

}


.nav-links a:hover{

color:#0057B8;

}



/* PAGE TITLE */


.page-header{

background:#0057B8;
color:white;
padding:70px 0;
text-align:center;

}


.page-header h1{

font-family:Poppins;
font-size:45px;

}



/* CART AREA */


.cart-layout{

display:grid;
grid-template-columns:2fr 1fr;
gap:40px;
padding:70px 0;

}



/* PRODUCTS */


.cart-items{

background:white;
border-radius:15px;
padding:30px;
box-shadow:0 10px 25px rgba(0,0,0,.06);

}


.cart-item{

display:flex;
align-items:center;
justify-content:space-between;

padding:25px 0;

border-bottom:1px solid #ddd;

}


.cart-item:last-child{

border-bottom:none;

}


.product-info{

display:flex;
align-items:center;
gap:20px;

}


.product-info img{

width:90px;
height:90px;
object-fit:cover;
border-radius:10px;

}


.product-name{

font-family:Poppins;
font-size:18px;

}


.price{

color:#0057B8;
font-weight:700;

}



/* QUANTITY */


.qty{

display:flex;
align-items:center;
gap:10px;

}


.qty button{

width:30px;
height:30px;

border:none;
background:#0057B8;
color:white;

border-radius:5px;

cursor:pointer;

}


.remove{

background:none;
border:none;
color:#c00;
cursor:pointer;
font-weight:600;

}



/* SUMMARY */


.summary{

background:white;
padding:30px;

border-radius:15px;

box-shadow:0 10px 25px rgba(0,0,0,.08);

height:max-content;

}


.summary h2{

font-family:Poppins;
color:#0057B8;
margin-bottom:25px;

}


.summary-row{

display:flex;
justify-content:space-between;
margin:15px 0;

}


.total{

font-size:24px;
font-weight:700;
border-top:1px solid #ddd;
padding-top:20px;

}



.checkout{

display:block;
text-align:center;

background:#0057B8;
color:white;

padding:15px;

border-radius:10px;

text-decoration:none;

margin-top:30px;

font-weight:600;

}


.checkout:hover{

background:#003F87;

}



/* EMPTY CART */


.empty{

text-align:center;
padding:50px;

}


.empty a{

display:inline-block;
margin-top:20px;

background:#0057B8;
color:white;

padding:15px 30px;

border-radius:10px;

text-decoration:none;

}




@media(max-width:900px){

.cart-layout{

grid-template-columns:1fr;

}


.cart-item{

flex-direction:column;
gap:20px;

}


.nav-links{

display:none;

}

}


</style>

</head>



<body>



<nav>

<div class="container">


<div class="logo">

<img src="images/logo.png" alt="Mono Safety Logo">

</div>



<ul class="nav-links">

<li><a href="index.html">Home</a></li>

<li><a href="products.html">Products</a></li>

<li><a href="about.html">About</a></li>

<li><a href="contact.html">Contact</a></li>


<li>

<a href="cart.html" class="cart-link">

🛒 Cart (<span id="cart-count">0</span>)

</a>

</li>


</ul>


</div>

</nav>





<section class="page-header">

<div class="container">

<h1>Your Shopping Cart</h1>

</div>

</section>







<section>


<div class="container cart-layout">



<div class="cart-items">


<h2>
Your Products
</h2>


<div id="cart-products">

</div>


</div>







<div class="summary">


<h2>
Order Summary
</h2>


<div class="summary-row">

<span>
Subtotal
</span>

<span>
€<span id="subtotal">0.00</span>
</span>

</div>



<div class="summary-row">

<span>
Delivery
</span>

<span>
€0.00
</span>

</div>



<div class="summary-row total">

<span>
Total
</span>

<span>
€<span id="total">0.00</span>
</span>

</div>



<a href="checkout.html" class="checkout">

Proceed To Checkout

</a>



</div>



</div>


</section>







<script>


function loadCart(){


let cart = JSON.parse(localStorage.getItem("cart")) || [];


let container=document.getElementById("cart-products");


let subtotal=0;



if(cart.length===0){


container.innerHTML=`

<div class="empty">

<h3>Your cart is empty</h3>

<a href="Products.html">
Continue Shopping
</a>

</div>

`;


return;

}





container.innerHTML="";



cart.forEach((item,index)=>{


subtotal += item.price * item.qty;



container.innerHTML += `


<div class="cart-item">


<div class="product-info">


<img src="${item.image}">


<div>

<div class="product-name">

${item.name}

</div>


<div class="price">

€${item.price.toFixed(2)}

</div>


</div>


</div>




<div class="qty">


<button onclick="changeQty(${index},-1)">
-
</button>


<span>
${item.qty}
</span>


<button onclick="changeQty(${index},1)">
+
</button>


</div>




<button class="remove" onclick="removeItem(${index})">

Remove

</button>



</div>



`;



});



document.getElementById("subtotal").innerHTML=subtotal.toFixed(2);

document.getElementById("total").innerHTML=subtotal.toFixed(2);



}




function changeQty(index,value){


let cart=JSON.parse(localStorage.getItem("cart")) || [];


cart[index].qty += value;



if(cart[index].qty <=0){

cart[index].qty=1;

}


localStorage.setItem("cart",JSON.stringify(cart));


loadCart();


}




function removeItem(index){


let cart=JSON.parse(localStorage.getItem("cart")) || [];


cart.splice(index,1);


localStorage.setItem("cart",JSON.stringify(cart));


loadCart();


}



loadCart();



</script>

<script src="js/scriptt.js"></script>

</body>

</html>
